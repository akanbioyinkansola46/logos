<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigerian Bank Logos Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #111111;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #666666;
            margin-bottom: 40px;
        }

        .gallery-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
        }

        .bank-card {
            background-color: #ffffff;
            border: 2px solid #dddddd;
            border-radius: 10px;
            width: 250px;
            padding: 25px 20px;
            text-decoration: none;
            color: inherit;
        }

        .bank-card:hover {
            border-color: #007bff;
        }

        .bank-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .gt-title {
            color: orangered;
        }

        .sterling-title {
            color: #e50914;
        }

        .uba-title {
            color: #d32f2f;
        }

        .bank-desc {
            font-size: 0.95rem;
            color: #555555;
            margin-bottom: 20px;
        }

        .btn-link {
            display: inline-block;
            padding: 8px 16px;
            background-color: #333333;
            color: #ffffff;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .bank-card:hover .btn-link {
            background-color: #007bff;
        }
    </style>
</head>
<body>
    <h1>NIGERIAN BANK LOGOS GALLERY</h1>
    <p class="subtitle">Click on any bank below to view its logo design page.</p>

    <div class="gallery-container">
        <a href="./Gtbank/gtb.html" class="bank-card">
            <h2 class="bank-title gt-title">GTBank</h2>
            <p class="bank-desc">Guaranty Trust Bank Logo Design</p>
            <span class="btn-link">View Logo</span>
        </a>

        <a href="./sterling/sterling.html" class="bank-card">
            <h2 class="bank-title sterling-title">Sterling</h2>
            <p class="bank-desc">Sterling Bank Logo Design</p>
            <span class="btn-link">View Logo</span>
        </a>

        <a href="./UBA/uba.html" class="bank-card">
            <h2 class="bank-title uba-title">UBA</h2>
            <p class="bank-desc">United Bank For Africa Logo Design</p>
            <span class="btn-link">View Logo</span>
        </a>
    </div>
</body>
</html>
