<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBA Logo Showcase - Nigerian Banks Logo Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="uba.css">
</head>
<body class="body">
    <nav class="navbar">
        <a href="../index.html" class="nav-back">&larr; Back to Gallery</a>
        <div class="nav-switcher">
            <span class="switcher-label">Switch Bank:</span>
            <a href="../Gtbank/gtb.html" class="nav-link">GTBank</a>
            <a href="../sterling/sterling.html" class="nav-link">Sterling</a>
            <a href="uba.html" class="nav-link active">UBA</a>
        </div>
    </nav>

    <main class="content-container">
        <div class="showcase-card">
            <div class="whitebox">
                <div class="redbox">
                    <img src="./UBA.JPG" class="logo" alt="UBA Logo Icon">
                    <span class="text">UBA</span>
                    <h1 class="text2">United Bank For Africa</h1>
                </div>
            </div>
        </div>

        <div class="details-card">
            <div class="details-section">
                <h3>Brand Details</h3>
                <div class="detail-row">
                    <span class="detail-label">Institution:</span>
                    <span class="detail-value">United Bank for Africa (UBA)</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Primary Color:</span>
                    <span class="detail-value"><span class="color-swatch" style="background-color: #d32f2f;"></span> UBA Red (#D32F2F)</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Secondary Color:</span>
                    <span class="detail-value"><span class="color-swatch" style="background-color: #ffffff; border: 1px solid #444;"></span> Pure White (#FFFFFF)</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
